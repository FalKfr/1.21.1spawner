name: Build Spawner Protect 1.21.11

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spawnerprotect-1.21.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: spawnerprotect-1.21.11-jar
          path: |
            spawnerprotect-1.21.11/build/libs/spawnerprotect-*.jar
            !spawnerprotect-1.21.11/build/libs/*-sources.jar
